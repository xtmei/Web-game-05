<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f2aa73" />
  <meta name="description" content="A quiet summer ride through the Japanese countryside." />
  <title>夏日乡道 — Summer Road</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="./src/style.css" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js" } }
  </script>
</head>
<body>
  <main id="game" aria-label="夏日乡道骑行游戏">
    <div id="canvas-host"></div>
    <div class="film-grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="sunwash" aria-hidden="true"></div>

    <header class="top-mark" aria-hidden="true">
      <span class="mark-dot"></span>
      <span>夏の道</span>
      <span class="mark-divider"></span>
      <span class="mark-sub">COUNTRYSIDE · 17:42</span>
    </header>

    <section class="intro" id="intro" aria-label="开始骑行">
      <div class="intro-card">
        <p class="intro-kicker">晚夏 · 日本乡间</p>
        <h1>夏日乡道</h1>
        <p class="intro-subtitle">一段安静的骑行</p>
        <button id="start-button" type="button">
          <span class="play-mark">▶</span>
          <span>开始骑行</span>
          <span class="start-en">BEGIN RIDE</span>
        </button>
        <p class="intro-hint">WASD / 方向键 · 也可触屏操作</p>
      </div>
      <div class="intro-bottom">BREATHE IN · LET THE AFTERNOON PASS</div>
    </section>

    <div class="ride-hud" id="ride-hud" aria-hidden="true">
      <div class="speed-card">
        <div class="speed-label">CRUISING</div>
        <div class="speed-value"><span id="speed-value">18</span><small>km/h</small></div>
        <div class="speed-track"><i id="speed-track-fill"></i></div>
      </div>
      <div class="ride-time"><span class="time-dot"></span><span id="ride-time">00:00</span><span class="time-place">田園の道</span></div>
      <button id="sound-toggle" class="sound-toggle" type="button" aria-label="切换环境声音" title="切换环境声音"><span class="sound-glyph">♫</span></button>
    </div>

    <div class="touch-controls" id="touch-controls" aria-label="触屏骑行控制">
      <div class="steer-pad">
        <button data-control="left" aria-label="向左转">‹</button>
        <button data-control="right" aria-label="向右转">›</button>
      </div>
      <div class="pace-pad">
        <button data-control="brake" aria-label="减速">−</button>
        <button data-control="accelerate" aria-label="加速">＋</button>
      </div>
    </div>

    <div class="edge-caption" aria-hidden="true"><span>風が吹いている</span><i></i><span>THE WIND IS SOFT</span></div>
    <div id="notice" class="notice" role="status"></div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
